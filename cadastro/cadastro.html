<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Econex</title>
    <link rel="stylesheet" href="cadastro.css" />
  </head>
  <body>
    <main class="cadastro-container">
      <section class="banner-container">
        <img
          src="../assets/images/baner_login.png"
          alt="Sua jornada começa aqui com ECONEX"
          class="banner-imagem"
        />
      </section>
      <section class="formulario-container">
        <div class="cabecalho-formulario">
          <h1>Crie sua conta!</h1>
          <p>Comece sua jornada econômica com o ECONEX.</p>
        </div>

        <form action="" id="formulario-cadastro">
          <div class="campo-formulario">
            <label for="nome">Nome Completo</label>

            <div class="input-container">
              <i data-lucide="user-round"></i>
              <input type="text" id="nome" required />
            </div>
          </div>

          <div class="campo-formulario">
            <label for="email">Email</label>

            <div class="input-container">
              <i data-lucide="mail"></i>
              <input type="email" id="email" required />
            </div>
          </div>

          <div class="campo-formulario">
            <label for="nascimento">Data de Nascimento</label>

            <div class="input-container">
              <i data-lucide="calendar-days"></i>
              <input type="date" id="nascimento" required />
            </div>
          </div>

          <div class="campo-formulario">
            <label for="senha">Senha</label>

            <div class="input-container">
              <i data-lucide="lock-keyhole"></i>
              <input type="password" id="senha" required minlength="8" />
              <button type="button" id="mostrar-senha">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="campo-formulario">
            <label for="confirmar-senha">Confirme sua senha</label>

            <div class="input-container">
              <i data-lucide="lock-keyhole"></i>
              <input
                type="password"
                id="confirmar-senha"
                required
                minlength="8"
              />
              <button type="button" id="mostrar-confirmar-senha">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="botao-container">
            <button type="submit" class="botao-cadastro">
              Criar minha conta
            </button>
          </div>

          <p class="link-login">
            Já tem uma conta?
            <a href="../login/login.html">Faça login.</a>
          </p>
        </form>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="cadastro.js" defer></script>
  </body>
</html>
